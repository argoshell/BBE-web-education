name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Rebuilds Beer's original C++ with emscripten and checks the committed fixtures still match it.
  reference-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Build fixtures from the original C++
        run: |
          node scripts/fetch-beer-sources.mjs
          EMSDK_SKIP_ENV=1 bash native/build-fixtures.sh
      - name: Fixtures are up to date
        run: git diff --exit-code tests/fixtures
